name: release

# 打 tag 即发布：v0.1.0、v0.2.0 …
# 也可以在 Actions 页面手动触发（workflow_dispatch），产物会挂在一次 draft release 上。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # 缓存 cargo 的编译产物，第二次构建能省掉大部分时间
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Build (Tauri CLI，前端会嵌进二进制)
        run: npx tauri build

      # 诊断工具：hub probe / secret / accounts / checkin …
      # 别的电脑上报「取不到密钥」时，把 hub.exe 拷过去跑一条命令就能定位
      - name: Build CLI
        run: cargo build --release -p hub-cli

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时没有 tag，用版本号兜底
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.run_number) }}
          name: WorkBuddy Hub ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/workbuddy-hub.exe
            target/release/hub.exe
